openapi: 3.0.3
info:
  title: contact-form API
  version: 1.0.0
  description: Shared contact form backend for wwt.co, cloudvantage.co, donornode.cloud, and donornode.com. Allowed browser origins include https://donornode.cloud, its app/dev/demo HTTPS subdomains, and https://donornode.com (apex only).
servers:
  - url: https://contact-form.example.com
paths:
  /api/contact/{contactSecret}:
    options:
      summary: CORS preflight for the protected contact endpoint
      parameters:
        - $ref: '#/components/parameters/ContactSecret'
      responses:
        '204':
          description: Preflight accepted.
        '403':
          description: Origin is not allowed.
    get:
      summary: Describe how to use the protected contact endpoint
      parameters:
        - $ref: '#/components/parameters/ContactSecret'
      responses:
        '200':
          description: Endpoint metadata for human callers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
              examples:
                info:
                  value:
                    result: true
                    message: Contact form endpoint. Submit this route with POST.
        '403':
          description: Browser origin is not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '404':
          description: Secret route mismatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
    post:
      summary: Submit a contact form
      parameters:
        - $ref: '#/components/parameters/ContactSecret'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactForm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ContactForm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ContactForm'
      responses:
        '200':
          description: Form accepted and both emails were sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
              examples:
                success:
                  value:
                    result: true
                    message: Thanks. Your message has been sent successfully.
        '400':
          description: Validation or reCAPTCHA failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '403':
          description: Browser origin is not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '404':
          description: Secret route mismatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '415':
          description: Unsupported content type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '500':
          description: Server configuration failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '502':
          description: reCAPTCHA transport failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '503':
          description: SES delivery failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
  /api/v2/contact:
    options:
      summary: CORS preflight for the config-driven contact endpoint
      responses:
        '204':
          description: Preflight accepted; Access-Control-Allow-Origin echoes the matched origin.
        '403':
          description: Origin is not configured.
    post:
      summary: Submit a contact form routed by server-side config
      description: >
        Config-driven multi-tenant endpoint. The request Origin is matched
        against server-side routing config; on a match the submission is emailed
        to the matched site's to/cc recipients. Per-site client key and
        reCAPTCHA may be required. Allowed origins are defined in config only
        (no hard-coded domains).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactFormV2'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ContactFormV2'
      responses:
        '200':
          description: Form accepted and emails were sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '400':
          description: Validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '403':
          description: Origin not allowed or client key missing/invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '413':
          description: Request body too large.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '415':
          description: Unsupported content type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '500':
          description: Server configuration failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '502':
          description: reCAPTCHA transport failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '503':
          description: SES delivery failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
components:
  parameters:
    ContactSecret:
      name: contactSecret
      in: path
      required: true
      schema:
        type: string
      description: Shared protected integration path segment.
  schemas:
    ContactForm:
      type: object
      additionalProperties: false
      required:
        - name
        - email
        - message
        - g-recaptcha-response
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: string
        company:
          type: string
        inquiry_type:
          type: string
        subject:
          type: string
        message:
          type: string
          minLength: 1
        g-recaptcha-response:
          type: string
          minLength: 1
    ContactFormV2:
      type: object
      additionalProperties: false
      required:
        - name
        - email
        - message
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: string
        organization:
          type: string
        company:
          type: string
        inquiry_type:
          type: string
        subject:
          type: string
        message:
          type: string
          minLength: 1
        g-recaptcha-response:
          type: string
    ContactResponse:
      type: object
      additionalProperties: false
      required:
        - result
        - message
      properties:
        result:
          type: boolean
        message:
          type: string
